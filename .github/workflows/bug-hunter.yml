name: Bug-Hunter (Autonomous Bug Fix)

on:
  # PAUSED 2026-05-15 — investigasi Firestore write quota.
  # Re-enable setelah root cause ditemukan & diperbaiki.
  # schedule:
  #   - cron: '0 19 * * *'

  # Manual trigger: isi issue number spesifik, atau kosongkan untuk semua
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number yang mau di-fix (kosong = proses semua ai-fixable issues, maks 3)'
        required: false
        type: string
      dry_run:
        description: 'Dry run — validasi setup saja, tanpa jalankan Claude'
        required: false
        type: boolean
        default: false

# Hanya satu bug-hunter run berjalan sekaligus (worktrees di runner bisa conflict)
concurrency:
  group: bug-hunter
  cancel-in-progress: false

jobs:
  # ─── Job 1: Temukan issues yang perlu di-fix ───────────────────────────────
  discover-issues:
    name: Discover ai-fixable issues
    runs-on: ubuntu-latest
    outputs:
      issue_numbers: ${{ steps.discover.outputs.issue_numbers }}
      skip: ${{ steps.discover.outputs.skip }}

    steps:
      - name: Discover open issues
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "issue_numbers=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "${{ github.event.inputs.issue_number }}" ]]; then
            # Manual run dengan issue spesifik
            NUMS="[${{ github.event.inputs.issue_number }}]"
          else
            # Auto-discover: ambil maks 3 issue open dengan label bug + ai-fixable
            NUMS=$(gh issue list \
              --repo "${{ github.repository }}" \
              --label "bug" \
              --label "ai-fixable" \
              --state open \
              --limit 3 \
              --json number \
              --jq '[.[].number]')
          fi

          echo "Discovered issues: $NUMS"

          if [[ "$NUMS" == "[]" || -z "$NUMS" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          echo "issue_numbers=${NUMS}" >> "$GITHUB_OUTPUT"

  # ─── Job 2: Fix setiap issue secara sequential ────────────────────────────
  fix-issue:
    name: Fix issue #${{ matrix.issue_number }}
    needs: discover-issues
    runs-on: ubuntu-latest
    if: needs.discover-issues.outputs.skip != 'true'

    strategy:
      max-parallel: 1       # Sequential untuk avoid worktree conflicts di runner
      fail-fast: false       # Lanjut ke issue berikutnya meski satu gagal
      matrix:
        issue_number: ${{ fromJson(needs.discover-issues.outputs.issue_numbers) }}

    steps:
      - name: Checkout repository (full history untuk worktrees)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/sj-monitor/package-lock.json

      - name: Install sj-monitor dependencies
        working-directory: apps/sj-monitor
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git untuk automated commits
        run: |
          git config user.name  "Bug-Hunter Bot"
          git config user.email "bug-hunter-bot@users.noreply.github.com"

      - name: Run Bug-Hunter pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/bug-hunter.sh
          ./scripts/bug-hunter.sh ${{ matrix.issue_number }}

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bug-hunter-log-issue-${{ matrix.issue_number }}
          path: /tmp/claude-output-*.txt
          retention-days: 7

  # ─── Job 3: Dry run — hanya validasi setup ─────────────────────────────────
  dry-run-check:
    name: Dry run — validate pipeline setup
    needs: discover-issues
    runs-on: ubuntu-latest
    if: github.event.inputs.dry_run == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/sj-monitor/package-lock.json

      - name: Install dependencies
        working-directory: apps/sj-monitor
        run: npm ci

      - name: Validate test harness
        working-directory: apps/sj-monitor
        run: |
          echo "=== npm test ==="
          npm test

          echo "=== npm run lint ==="
          npm run lint

          echo "=== npm run build ==="
          npm run build

          echo "=== Dry run complete — semua checks passed ==="
